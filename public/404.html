<!DOCTYPE html>
<html lang="da">
  <head>
    <meta charset="utf-8" />
    <title>Music DNA</title>
    <!--
      GitHub Pages has no server-side rewrites, so a direct navigation or
      refresh on a client-side route (e.g. /music-dna1/callback, needed for
      the Spotify OAuth redirect) would otherwise 404. This is the standard
      spa-github-pages redirect trick: encode the real path into a query
      string, bounce to the app root, and index.html restores it via
      history.replaceState before React Router mounts.
      https://github.com/rafgraph/spa-github-pages
    -->
    <script type="text/javascript">
      var pathSegmentsToKeep = 1; // keep "/music-dna1"

      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body></body>
</html>
